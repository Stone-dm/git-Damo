# ===== Party School — Docker Compose =====
#
# 一键启动（MySQL + Agent + Backend + Frontend）：
#   docker compose up -d
#
# 需要完整向量栈时（额外启动 etcd + minio + milvus）：
#   docker compose --profile milvus up -d
#
# 首次使用请先创建 .env：
#   cp .env.example .env
#   # 编辑 .env 填写 DEEPSEEK_API_KEY 等
#
# 若本机已有 Milvus (19530)，设置 MILVUS_HOST=host.docker.internal 且不要加 --profile milvus

services:
  mysql:
    image: mysql:8.0
    container_name: party-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: party_school
      MYSQL_USER: party
      MYSQL_PASSWORD: party123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd:
    profiles: ["milvus"]
    image: quay.io/coreos/etcd:v3.5.5
    container_name: party-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    profiles: ["milvus"]
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: party-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data
    ports:
      - "9001:9001"

  milvus:
    profiles: ["milvus"]
    image: milvusdb/milvus:v2.3.4
    container_name: party-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  agent:
    build: ./agent
    container_name: party-agent
    environment:
      - MILVUS_HOST=${MILVUS_HOST:-milvus}
      - MILVUS_PORT=${MILVUS_PORT:-19530}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-text-embedding-3-small}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-1536}
      - AGENT_SHARED_TOKEN=${AGENT_SHARED_TOKEN:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Agent 不硬依赖 milvus — Milvus 不可达时自动降级（伪向量/降级文案）
    # 需要完整向量检索时：docker compose --profile milvus up -d
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: party-backend
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DB=${MYSQL_DB:-party_school}
      - MYSQL_USER=${MYSQL_USER:-party}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-party123}
      - JWT_SECRET=${JWT_SECRET:-change-me-to-a-long-random-string}
      - AGENT_BASE_URL=http://agent:8000
      - AGENT_SHARED_TOKEN=${AGENT_SHARED_TOKEN:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: party-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql_data:
  etcd_data:
  minio_data:
  milvus_data:
